name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    steps:
      - name: Download and verify GeoIP and GeoSite data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources

          download_dat() {
            local output="$1"
            local source="$2"
            local expected
            expected="$(curl -fsSL "${source}.sha256sum" | awk 'NR == 1 { print $1 }')"
            if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ ]]; then
              echo "::error::Invalid SHA-256 metadata for $output"
              return 1
            fi
            curl --retry 3 --retry-all-errors -fsSL "$source" -o "resources/$output"
            printf '%s  %s\n' "$expected" "resources/$output" | sha256sum --check --status
            echo "Verified $output"
          }

          download_dat geoip.dat "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/geoip/geoip-lite.dat"
          download_dat geosite.dat "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/geosite/geosite.dat"

      - name: Upload verified geodata for test matrix
        uses: actions/upload-artifact@v7
        with:
          name: xray-test-geodata
          path: resources/*.dat
          if-no-files-found: error
          retention-days: 1

  check-format-and-proto:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
      - name: Check Protobuf
        run: go run ./infra/vprotogen/main.go -mode check -pwd ./

  test:
    needs: check-assets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download verified geodata
        uses: actions/download-artifact@v8
        with:
          name: xray-test-geodata
          path: resources
      - name: Test
        run: go test -timeout 1h -v ./...
